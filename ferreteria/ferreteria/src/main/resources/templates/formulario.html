<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferretería - Registrar Producto</title>

    <!-- Vinculación del archivo CSS externo -->
    <link rel="stylesheet" href="styles.css" th:href="@{/css/styles.css}">
</head>
<body>

<header>
    <h1>Ferretería</h1>
    <h2>Sistema de gestión</h2>
</header>

<main>
    <div class="form-container">
        <div class="form-header">
            <h2>Registrar producto</h2>
            <p>Completá los datos del producto</p>
        </div>

        <!-- THYMELEAF: El th:action apunta al endpoint de guardado y th:object asocia el modelo -->
        <form action="#" th:action="@{/productos/crear}" th:object="${producto}" method="post">

            <div class="form-grid">
                <!-- Nombre -->
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <!-- THYMELEAF: th:field enlaza este input con la propiedad 'nombre' de la clase Producto -->
                    <input type="text" id="nombre" name="nombre" th:field="*{nombre}" class="form-control" placeholder="Ej: Amoladora Angular" required>
                </div>

                <!-- Marca -->
                <div class="form-group">
                    <label for="marca">Marca</label>
                    <input type="text" id="marca" name="marca" th:field="*{marca}" class="form-control" placeholder="Ej: Bosch" required>
                </div>

                <!-- Categoría -->
                <div class="form-group">
                    <label for="categoria">Categoría</label>
                    <select id="categoria" name="categoria" th:field="*{categoria}" class="form-control" required>
                        <option value="">Seleccioná una categoría...</option>
                        <option value="Herramientas Eléctricas">Herramientas Eléctricas</option>
                        <option value="Herramientas Manuales">Herramientas Manuales</option>
                        <option value="Construcción">Construcción</option>
                        <option value="Pinturería">Pinturería</option>
                        <option value="Electricidad">Electricidad</option>
                        <option value="Plomería">Plomería</option>
                    </select>
                </div>

                <!-- Precio -->
                <div class="form-group">
                    <label for="precio">Precio ($)</label>
                    <input type="number" step="0.01" min="0" id="precio" name="precio" th:field="*{precio}" class="form-control" placeholder="0.00" required>
                </div>

                <!-- Stock -->
                <div class="form-group">
                    <label for="stock">Stock</label>
                    <input type="number" min="0" id="stock" name="stock" th:field="*{stock}" class="form-control" placeholder="Cantidad disponible" required>
                </div>

                <!-- Descripción (Ocupa todo el ancho) -->
                <div class="form-group full-width">
                    <label for="descripcion">Descripción</label>
                    <textarea id="descripcion" name="descripcion" th:field="*{descripcion}" class="form-control" rows="4" placeholder="Detalles técnicos y características del producto..." required></textarea>
                </div>
            </div>

            <!-- Botones de Acción -->
            <div class="form-actions">
                <!-- THYMELEAF: Botón de volver usando th:href para regresar a la vista de lista -->
                <a href="lista.html" th:href="@{/productos}" class="btn btn-secondary">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                    Volver
                </a>

                <button type="submit" class="btn btn-primary">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>
                    Guardar producto
                </button>
            </div>
        </form>
    </div>
</main>

</body>
</html>
